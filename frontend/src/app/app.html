<h1>Mini Roster Avengers</h1>

<input
  #searchBox
  type="search"
  placeholder="Buscar héroe"
  (input)="onSearch(searchBox.value)"
/>

@switch (status()) {
  @case ('loading') {
    <p>Cargando héroes...</p>
  }
  @case ('error') {
    <p>{{ error() }}</p>
  }
  @case ('empty') {
    <p>No hay héroes que coincidan.</p>
  }
  @case ('data') {
    <ul>
      @for (hero of heroes(); track hero.id) {
        <li>{{ hero.displayName }} — {{ hero.role }}</li>
      }
    </ul>
  }
}
